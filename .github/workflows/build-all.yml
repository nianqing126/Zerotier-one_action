# =============================================================================
# 一键编译全部架构 —— MT7621A + MT7620 + MT7981B
#
# 每个架构产出 3 套包：
#   ipk 1.14.x（OpenWrt 稳定版 feed 自带版本，含 LuCI 界面 + 中文语言包）
#   ipk 1.16.x（用 master 分支 zerotier 源码，在同一个稳定版 SDK 里编译）
#   apk 1.16.x（OpenWrt snapshot）
#
# 本文件完全自包含：不引用其它 workflow 文件，只依赖 scripts/build-zerotier.sh，
# 因此单独放进 .github/workflows/ 目录即可被 GitHub 识别并显示在 Actions 列表。
# =============================================================================
name: ZeroTier 全架构一键编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 稳定版版本号（编译 ipk 用，apk 固定用 snapshot）'
        required: true
        default: '23.05.5'
      release_tag:
        description: '发布到 Release 的 Tag（全部包合并到同一个 Release）'
        required: true
        default: 'zerotier-all-latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # workflow_dispatch 时有值；tag push 时 inputs 为空，回落到 23.05.5
  OPENWRT_VERSION: ${{ inputs.openwrt_version || '23.05.5' }}
  # tag push 用 tag 名，手动触发用输入的 tag
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  # ---------- 3 架构 × 3 种产物 = 9 个并行编译任务 ----------
  build:
    name: ${{ matrix.arch.name }} · ${{ matrix.variant.label }}
    runs-on: ubuntu-22.04
    # fail-fast: false → 某个架构失败不影响其它架构继续编译、继续发布
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: MT7621A, target: ramips,   subtarget: mt7621,  slug: mt7621 }
          - { name: MT7620,  target: ramips,   subtarget: mt7620,  slug: mt7620 }
          - { name: MT7981B, target: mediatek, subtarget: filogic, slug: mt7981 }
        variant:
          # fmt=apk 时脚本走 snapshot SDK（产出 apk）；fmt=ipk 时走稳定版 SDK（产出 ipk）
          # zt_ref 为空 → 用 SDK feed 自带版本；master → 用 master 分支源码（1.16.x）
          # luci=0 → 该任务不重复编译 LuCI 界面（与主程序版本无关，由 luci=1 的任务产出）
          - { fmt: ipk, id: ipk114, zt_ref: '',       luci: 1, label: 'ipk 1.14 (feed)' }
          - { fmt: ipk, id: ipk116, zt_ref: 'master', luci: 0, label: 'ipk 1.16 (master)' }
          - { fmt: apk, id: apk,    zt_ref: '',       luci: 1, label: 'apk snapshot' }

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip xz-utils bzip2 zstd zlib1g-dev file wget

      - name: 编译 ${{ matrix.arch.name }} (${{ matrix.variant.label }})
        env:
          ZT_WITH_LUCI: ${{ matrix.variant.luci }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant.fmt }}" = "ipk" ]; then
            VER="$OPENWRT_VERSION"
          else
            VER="snapshot"
          fi
          echo ">>> 目标: ${{ matrix.arch.target }}/${{ matrix.arch.subtarget }}"
          echo ">>> 版本: ${VER}   源码分支: ${{ matrix.variant.zt_ref || 'feed 自带' }}   LuCI: ${ZT_WITH_LUCI}"
          bash scripts/build-zerotier.sh \
            "${{ matrix.arch.target }}" \
            "${{ matrix.arch.subtarget }}" \
            "${VER}" \
            "${{ matrix.variant.zt_ref }}"

      - name: 整理产物
        run: |
          mkdir -p pkg
          cp -v out/*."${{ matrix.variant.fmt }}" pkg/ 2>/dev/null || true
          ls -lh pkg || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-${{ matrix.variant.id }}-${{ matrix.arch.slug }}
          path: pkg/*
          if-no-files-found: warn
          retention-days: 7

  # ---------- 汇总发布（只有一个 release job，避免多任务抢同一个 Release） ----------
  release:
    name: 发布到 Release
    needs: build
    # 始终执行：矩阵任务部分成功时也能发布已有产物；全失败时由下面的 count 判断跳过
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 统计产物
        id: check
        run: |
          mkdir -p dist
          echo "文件清单："
          ls -lh dist || true
          COUNT=$(find dist -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "共 ${COUNT} 个安装包"

      - name: 发布到 GitHub Release
        if: steps.check.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZeroTier 全架构 (${{ env.RELEASE_TAG }})
          body: |
            ## ZeroTier for OpenWrt —— 全架构一键编译

            覆盖 3 个架构，每个架构包含 **ipk 1.14 / ipk 1.16 / apk 1.16** 三套。

            | 架构 | OpenWrt target | 包架构 | 代表机型 |
            |---|---|---|---|
            | MT7621A | ramips/mt7621 | mipsel_24kc | 小米 3G/4A、Newifi D2、K2P、红米 AC2100 |
            | MT7620 | ramips/mt7620 | mipsel_24kc | 小米路由器 mini、斐讯 K2、极路由、优酷路由宝 |
            | MT7981B | mediatek/filogic | aarch64_cortex-a53 | GL-MT3000、小米 WR30U、360 T7、RAX3000M |

            ### 主程序版本怎么选

            | 文件特征 | 版本 | 说明 |
            |---|---|---|
            | `mt76xx-zerotier_1.14.*.ipk` | 1.14.x | 稳定版 feed 版本，与官方软件源一致 |
            | `mt76xx-zerotier_1.16.*.ipk` | 1.16.x | 用 master 源码在稳定版 SDK 内编译，可直接覆盖升级 1.14 |
            | `mt76xx-zerotier-1.16.*.apk` | 1.16.x | snapshot 版本 |

            1.16 的 ipk 与 1.14 用**同一套 SDK 与依赖**编译，因此可以直接替换安装、也可以先装 1.14 再用 1.16 覆盖升级。

            ### 配套的 LuCI 界面与语言包
            | 包名 | 说明 |
            |---|---|
            | `luci-app-zerotier` | LuCI 网页界面（菜单：VPN → ZeroTier），**全架构通用** |
            | `luci-i18n-zerotier-zh-cn` | LuCI 简体中文语言包，**全架构通用** |

            这两个包是 noarch，与主程序版本无关，各架构那份内容完全相同，任选其一安装即可。

            ### 安装

            ```sh
            # 以 MT7621A 为例（换成 mt7620 / mt7981 即可）
            # opkg 系统：先主程序（1.14 或 1.16 二选一），再装界面与语言包
            opkg update
            opkg install mt7621-zerotier_1.14*.ipk        # 或 mt7621-zerotier_1.16*.ipk
            opkg install mt7621-luci-app-zerotier_*.ipk mt7621-luci-i18n-zerotier-zh-cn_*.ipk

            # apk 系统（本地安装需 --allow-untrusted）
            apk add --allow-untrusted mt7621-zerotier-1.16*.apk \
              mt7621-luci-app-zerotier-*.apk mt7621-luci-i18n-zerotier-zh-cn-*.apk
            ```

            安装后到 **LuCI → VPN → ZeroTier** 填 Network ID 即可加入网络。
          files: dist/*
          fail_on_unmatched_files: false
