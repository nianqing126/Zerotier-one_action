# =============================================================================
# ZeroTier 云编译 —— MT7621A (ramips/mt7621, mipsel_24kc)
# 代表机型: 小米路由器 3G/4A、Newifi D2、斐讯 K2P、红米 AC2100 等
# 产出: .ipk (OpenWrt 23.05.x 稳定版) + .apk (OpenWrt snapshot)
# =============================================================================
name: ZeroTier MT7621A (ipk + apk)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 稳定版版本号（编译 ipk 用）'
        required: true
        default: '23.05.5'
      release_tag:
        description: '发布到 Release 的 Tag'
        required: true
        default: 'zerotier-mt7621-latest'
      upload_release:
        description: '是否发布到 Release'
        type: boolean
        default: true
  workflow_call:
    inputs:
      openwrt_version:
        type: string
        default: '23.05.5'
      release_tag:
        type: string
        default: 'zerotier-mt7621-latest'
      upload_release:
        type: boolean
        default: true
  push:
    tags:
      - 'mt7621-v*'

permissions:
  contents: write

env:
  TARGET: ramips
  SUBTARGET: mt7621
  ARCH_NAME: mt7621

jobs:
  # ---------- 编译 ipk（OpenWrt 稳定版 SDK） ----------
  build-ipk:
    name: 编译 ipk (OpenWrt ${{ inputs.openwrt_version || '23.05.5' }})
    # 固定 22.04：GNU coreutils + python3 distutils，避免新版镜像 uutils 导致 prereq 误判
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip xz-utils bzip2 zstd zlib1g-dev file wget

      - name: 编译 ZeroTier (ipk)
        run: bash scripts/build-zerotier.sh "$TARGET" "$SUBTARGET" "${{ inputs.openwrt_version || '23.05.5' }}"

      - name: 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-ipk-${{ env.ARCH_NAME }}
          path: out/*.ipk
          if-no-files-found: warn
          retention-days: 7

  # ---------- 编译 apk（OpenWrt snapshot SDK，apk 为新版包管理器） ----------
  build-apk:
    name: 编译 apk (OpenWrt snapshot)
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip xz-utils bzip2 zstd zlib1g-dev file wget

      - name: 编译 ZeroTier (apk)
        run: bash scripts/build-zerotier.sh "$TARGET" "$SUBTARGET" snapshot

      - name: 上传 apk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-apk-${{ env.ARCH_NAME }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ---------- 发布到 Release ----------
  release:
    name: 发布到 Release
    needs: [build-ipk, build-apk]
    # 任一格式编译成功即发布，避免单一格式失败导致完全不出包
    if: ${{ always() && inputs.upload_release && (needs.build-ipk.result == 'success' || needs.build-apk.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: zerotier-*-${{ env.ARCH_NAME }}
          path: dist
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          name: ZeroTier MT7621A ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          body: |
            ## ZeroTier for MT7621A (ramips/mt7621, mipsel_24kc)
            ### 包含的安装包（ipk / apk 各一套）
            | 包名 | 说明 |
            |---|---|
            | `zerotier` | ZeroTier 主程序与 init 脚本 |
            | `luci-app-zerotier` | LuCI 网页界面（VPN → ZeroTier） |
            | `luci-i18n-zerotier-zh-cn` | LuCI 中文语言包 |

            - `.ipk`：适用于 OpenWrt 21.02 / 22.03 / 23.05 / 24.10 等使用 opkg 的系统
            - `.apk`：适用于 OpenWrt 25.12 / SNAPSHOT 等使用 apk 包管理器的系统

            ```sh
            # opkg 系统
            opkg update && opkg install mt7621-zerotier_*.ipk mt7621-luci-app-zerotier_*.ipk mt7621-luci-i18n-zerotier-zh-cn_*.ipk
            # apk 系统（本地安装需 --allow-untrusted）
            apk add --allow-untrusted mt7621-zerotier-*.apk mt7621-luci-app-zerotier-*.apk mt7621-luci-i18n-zerotier-zh-cn-*.apk
            ```
          files: dist/*
          fail_on_unmatched_files: false
