# =============================================================================
# ZeroTier 云编译 —— MT7981B (mediatek/filogic, aarch64_cortex-a53)
# 代表机型: GL.iNet GL-MT3000 (Beryl AX)、小米 WR30U、360 T7、CMCC RAX3000M 等
# 产出: .ipk (OpenWrt 23.05.x 稳定版) + .apk (OpenWrt snapshot)
# =============================================================================
name: ZeroTier MT7981B (ipk + apk)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 稳定版版本号（编译 ipk 用）'
        required: true
        default: '23.05.5'
      release_tag:
        description: '发布到 Release 的 Tag'
        required: true
        default: 'zerotier-mt7981-latest'
      upload_release:
        description: '是否发布到 Release'
        type: boolean
        default: true
  workflow_call:
    inputs:
      openwrt_version:
        type: string
        default: '23.05.5'
      release_tag:
        type: string
        default: 'zerotier-mt7981-latest'
      upload_release:
        type: boolean
        default: true
  push:
    tags:
      - 'mt7981-v*'

permissions:
  contents: write

env:
  TARGET: mediatek
  SUBTARGET: filogic
  ARCH_NAME: mt7981

jobs:
  # ---------- 编译 ipk（OpenWrt 稳定版 SDK）：1.14 与 1.16 两套 ----------
  build-ipk:
    name: 编译 ipk (${{ inputs.openwrt_version || '23.05.5' }} · ${{ matrix.label }})
    # 固定 22.04：GNU coreutils + python3 distutils，避免新版镜像 uutils 导致 prereq 误判
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # zt_ref 为空 → 用 SDK feed 自带版本（1.14.x），同时编 LuCI 界面与中文语言包
        # zt_ref=master → 用 master 分支源码编 1.16.x，LuCI 不重复编（与版本无关，一套足够）
        include:
          - { zt_ref: '',       luci: 1, label: '1.14 feed',   suffix: luci }
          - { zt_ref: 'master', luci: 0, label: '1.16 master', suffix: main }
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip xz-utils bzip2 zstd zlib1g-dev file wget

      - name: 编译 ZeroTier (ipk ${{ matrix.label }})
        env:
          ZT_WITH_LUCI: ${{ matrix.luci }}
        run: |
          bash scripts/build-zerotier.sh \
            "$TARGET" "$SUBTARGET" \
            "${{ inputs.openwrt_version || '23.05.5' }}" \
            "${{ matrix.zt_ref }}"

      - name: 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-ipk-${{ env.ARCH_NAME }}-${{ matrix.suffix }}
          path: out/*.ipk
          if-no-files-found: warn
          retention-days: 7

  # ---------- 编译 apk（OpenWrt snapshot SDK，apk 为新版包管理器） ----------
  build-apk:
    name: 编译 apk (OpenWrt snapshot)
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip xz-utils bzip2 zstd zlib1g-dev file wget

      - name: 编译 ZeroTier (apk)
        run: bash scripts/build-zerotier.sh "$TARGET" "$SUBTARGET" snapshot

      - name: 上传 apk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-apk-${{ env.ARCH_NAME }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ---------- 发布到 Release ----------
  release:
    name: 发布到 Release
    needs: [build-ipk, build-apk]
    # 只要有任一产物就发布：矩阵任务（1.14 / 1.16）部分失败也不影响另一套出包
    if: ${{ always() && !cancelled() && inputs.upload_release }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: zerotier-*${{ env.ARCH_NAME }}*
          path: dist
          merge-multiple: true

      - name: 统计产物
        id: check
        run: |
          mkdir -p dist
          echo "文件清单："
          ls -lh dist || true
          COUNT=$(find dist -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "共 ${COUNT} 个安装包"

      - name: 发布到 GitHub Release
        if: steps.check.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          name: ZeroTier MT7981B ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          body: |
            ## ZeroTier for MT7981B (mediatek/filogic, aarch64_cortex-a53)
            ### 主程序版本（ipk 两套 + apk 一套）

            | 文件 | 版本 | 说明 |
            |---|---|---|
            | `mt7981-zerotier_1.14*.ipk` | 1.14.x | 稳定版 feed 自带版本 |
            | `mt7981-zerotier_1.16*.ipk` | 1.16.x | master 分支源码 + 同一稳定版 SDK 编译 |
            | `mt7981-zerotier-1.16*.apk` | 1.16.x | snapshot 版本 |

            1.16 的 ipk 与 1.14 使用同一套 SDK、同一批依赖，可直接覆盖升级（先装 1.14 再装 1.16 也可）。

            ### 配套的界面与语言包（noarch，全架构通用）
            | 包名 | 说明 |
            |---|---|
            | `luci-app-zerotier` | LuCI 网页界面（VPN → ZeroTier） |
            | `luci-i18n-zerotier-zh-cn` | LuCI 中文语言包 |

            ```sh
            # opkg 系统：主程序 1.14 / 1.16 二选一，再装界面与语言包
            opkg update
            opkg install mt7981-zerotier_1.14*.ipk        # 或 mt7981-zerotier_1.16*.ipk
            opkg install mt7981-luci-app-zerotier_*.ipk mt7981-luci-i18n-zerotier-zh-cn_*.ipk

            # apk 系统（本地安装需 --allow-untrusted）
            apk add --allow-untrusted mt7981-zerotier-1.16*.apk \
              mt7981-luci-app-zerotier-*.apk mt7981-luci-i18n-zerotier-zh-cn-*.apk
            ```
          files: dist/*
          fail_on_unmatched_files: false
