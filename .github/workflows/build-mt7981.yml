# =============================================================================
# ZeroTier 云编译 —— MT7981B (mediatek/filogic, aarch64_cortex-a53)
# 代表机型: GL.iNet GL-MT3000 (Beryl AX)、小米 WR30U、360 T7、CMCC RAX3000M 等
# 产出: .ipk (OpenWrt 23.05.x 稳定版) + .apk (OpenWrt snapshot)
# =============================================================================
name: ZeroTier MT7981B (ipk + apk)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 稳定版版本号（编译 ipk 用）'
        required: true
        default: '23.05.5'
      release_tag:
        description: '发布到 Release 的 Tag'
        required: true
        default: 'zerotier-mt7981-latest'
      upload_release:
        description: '是否发布到 Release'
        type: boolean
        default: true
  workflow_call:
    inputs:
      openwrt_version:
        type: string
        default: '23.05.5'
      release_tag:
        type: string
        default: 'zerotier-mt7981-latest'
      upload_release:
        type: boolean
        default: true
  push:
    tags:
      - 'mt7981-v*'

permissions:
  contents: write

env:
  TARGET: mediatek
  SUBTARGET: filogic
  ARCH_NAME: mt7981

jobs:
  # ---------- 编译 ipk（OpenWrt 稳定版 SDK） ----------
  build-ipk:
    name: 编译 ipk (OpenWrt ${{ inputs.openwrt_version || '23.05.5' }})
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: 编译 ZeroTier (ipk)
        run: bash scripts/build-zerotier.sh "$TARGET" "$SUBTARGET" "${{ inputs.openwrt_version || '23.05.5' }}"

      - name: 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-ipk-${{ env.ARCH_NAME }}
          path: out/*.ipk
          retention-days: 7

  # ---------- 编译 apk（OpenWrt snapshot SDK，apk 为新版包管理器） ----------
  build-apk:
    name: 编译 apk (OpenWrt snapshot)
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: 编译 ZeroTier (apk)
        run: bash scripts/build-zerotier.sh "$TARGET" "$SUBTARGET" snapshot

      - name: 上传 apk 产物
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-apk-${{ env.ARCH_NAME }}
          path: out/*.apk
          retention-days: 7

  # ---------- 发布到 Release ----------
  release:
    name: 发布到 Release
    needs: [build-ipk, build-apk]
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: zerotier-*-${{ env.ARCH_NAME }}
          path: dist
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          name: ZeroTier MT7981B ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          body: |
            ## ZeroTier for MT7981B (mediatek/filogic, aarch64_cortex-a53)
            - `.ipk`：适用于 OpenWrt 22.03 / 23.05 等使用 opkg 的稳定版系统
            - `.apk`：适用于 OpenWrt SNAPSHOT（24.10 之后使用 apk 包管理器的系统）
            - 安装命令: `opkg install zerotier_*.ipk` 或 `apk add --allow-untrusted zerotier-*.apk`
          files: dist/*
          fail_on_unmatched_files: true
